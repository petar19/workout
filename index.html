<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .btn-info {
            background: #4299e1;
            color: white;
        }

        .btn-info:hover {
            background: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            min-width: auto;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .exercises-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .exercise-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .exercise-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .exercise-title {
            font-size: 1.5rem;
            color: #2d3748;
            font-weight: 700;
        }

        .exercise-body-parts {
            color: #718096;
            font-size: 0.9rem;
            font-style: italic;
            margin-top: 5px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin-bottom: 15px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .sets-container {
            margin-bottom: 15px;
        }

        .set-row {
            display: grid;
            grid-template-columns: auto 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .set-label {
            font-weight: 600;
            color: #4a5568;
        }

        .set-input {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .set-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .exercise-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .exercise-title {
                font-size: 1.2rem;
            }

            .set-row {
                grid-template-columns: auto 1fr 1fr auto;
                gap: 5px;
                padding: 8px;
            }

            .btn {
                min-width: 120px;
                padding: 10px 16px;
            }

            .modal-content {
                padding: 20px;
            }
        }

        .workout-title-container {
            margin-bottom: 20px;
        }

        .workout-title-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        .workout-title-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .timer-container {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .editable-field {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .editable-field:hover {
            background: #e2e8f0;
        }

        .edit-icon {
            margin-left: 8px;
            font-size: 0.8em;
            color: #718096;
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                min-width: auto;
            }

            .set-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .set-label {
                grid-column: 1 / -1;
            }

            .set-row .set-input {
                width: 100%;
            }

            .set-row .btn {
                width: 100%;
            }

            .exercise-controls {
                flex-direction: column;
            }

            .timer-display {
                font-size: 2rem;
            }

            .workout-title-input {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Workout Tracker</h1>
        
        <!-- Workout Title -->
        <div class="workout-title-container">
            <input type="text" id="workout-title" class="workout-title-input" placeholder="Enter workout name..." value="My Workout">
        </div>
        
        <!-- Timer -->
        <div class="timer-container">
            <div class="timer-display" id="timer-display">00:00:00</div>
            <div class="timer-controls">
                <button class="btn btn-success btn-small" id="play-btn" onclick="startTimer()">▶️ Play</button>
                <button class="btn btn-danger btn-small" id="pause-btn" onclick="pauseTimer()" style="display: none;">⏸️ Pause</button>
                <button class="btn btn-info btn-small" onclick="resetTimer()">🔄 Reset</button>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="showAddExerciseModal()">➕ Add Exercise</button>
            <button class="btn btn-success" onclick="saveWorkout()">💾 Save Workout</button>
            <button class="btn btn-danger" onclick="resetWorkout()">🔄 Reset Workout</button>
            <button class="btn btn-info" onclick="resetAllValues()">⚡ Reset All Values</button>
            <button class="btn btn-success" onclick="exportWorkout()">📥 Export Workout</button>
            <button class="btn btn-info" onclick="importWorkout()">📤 Import Workout</button>
        </div>

        <div id="exercises-container" class="exercises-container">
            <div class="empty-state">
                <div class="empty-state-icon">🏋️</div>
                <div class="empty-state-text">No exercises yet</div>
                <p>Click "Add Exercise" to get started with your workout plan!</p>
            </div>
        </div>
    </div>

    <!-- Add Exercise Modal -->
    <div id="add-exercise-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Add New Exercise</div>
            <div class="form-group">
                <label class="form-label">Exercise Name *</label>
                <input type="text" id="exercise-name" class="form-input" placeholder="e.g., Bench Press" required>
            </div>
            <div class="form-group">
                <label class="form-label">YouTube Video URL (optional)</label>
                <input type="text" id="exercise-video" class="form-input" placeholder="e.g., https://www.youtube.com/watch?v=...">
            </div>
            <div class="form-group">
                <label class="form-label">Body Parts Worked (optional)</label>
                <input type="text" id="exercise-body-parts" class="form-input" placeholder="e.g., Chest, Triceps, Shoulders">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="addExercise()">Add Exercise</button>
                <button class="btn btn-danger" onclick="closeAddExerciseModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let exercises = [];
        let workoutTitle = 'My Workout';
        let timerRunning = false;
        let timerSeconds = 0;
        let timerInterval = null;

        // Load exercises from localStorage on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderExercises();
        });

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('workoutPlan');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.exercises) {
                        exercises = data.exercises;
                        workoutTitle = data.workoutTitle || 'My Workout';
                        timerSeconds = data.timerSeconds || 0;
                        document.getElementById('workout-title').value = workoutTitle;
                        updateTimerDisplay();
                    } else {
                        // Legacy format
                        exercises = data;
                    }
                } catch (e) {
                    console.error('Error loading from localStorage:', e);
                }
            }
        }

        function saveToLocalStorage() {
            const data = {
                workoutTitle: workoutTitle,
                exercises: exercises,
                timerSeconds: timerSeconds
            };
            localStorage.setItem('workoutPlan', JSON.stringify(data));
        }

        function saveWorkout() {
            workoutTitle = document.getElementById('workout-title').value.trim() || 'My Workout';
            saveToLocalStorage();
            alert('Workout saved successfully!');
        }

        function resetWorkout() {
            if (confirm('Are you sure you want to reset the entire workout? This will delete all exercises.')) {
                exercises = [];
                timerSeconds = 0;
                pauseTimer();
                updateTimerDisplay();
                saveToLocalStorage();
                renderExercises();
                alert('Workout reset successfully!');
            }
        }

        function resetAllValues() {
            if (confirm('Are you sure you want to reset all weight and reps values?')) {
                exercises.forEach(exercise => {
                    exercise.sets.forEach(set => {
                        set.weight = '';
                        set.reps = '';
                    });
                });
                saveToLocalStorage();
                renderExercises();
                alert('All values reset successfully!');
            }
        }

        // Timer functions
        function startTimer() {
            if (!timerRunning) {
                timerRunning = true;
                document.getElementById('play-btn').style.display = 'none';
                document.getElementById('pause-btn').style.display = 'inline-block';
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateTimerDisplay();
                    saveToLocalStorage();
                }, 1000);
            }
        }

        function pauseTimer() {
            if (timerRunning) {
                timerRunning = false;
                document.getElementById('play-btn').style.display = 'inline-block';
                document.getElementById('pause-btn').style.display = 'none';
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 0;
            updateTimerDisplay();
            saveToLocalStorage();
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timerSeconds / 3600);
            const minutes = Math.floor((timerSeconds % 3600) / 60);
            const seconds = timerSeconds % 60;
            const display = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('timer-display').textContent = display;
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours}h${minutes}m${secs}s`;
        }

        function showAddExerciseModal() {
            document.getElementById('add-exercise-modal').classList.add('active');
        }

        function closeAddExerciseModal() {
            document.getElementById('add-exercise-modal').classList.remove('active');
            document.getElementById('exercise-name').value = '';
            document.getElementById('exercise-video').value = '';
            document.getElementById('exercise-body-parts').value = '';
        }

        function getYouTubeEmbedUrl(url) {
            if (!url) return null;
            
            // Extract video ID from various YouTube URL formats
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/,
                /youtube\.com\/embed\/([^&\s]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    return `https://www.youtube.com/embed/${match[1]}`;
                }
            }
            
            return null;
        }

        function addExercise() {
            const name = document.getElementById('exercise-name').value.trim();
            const videoUrl = document.getElementById('exercise-video').value.trim();
            const bodyParts = document.getElementById('exercise-body-parts').value.trim();

            if (!name) {
                alert('Please enter an exercise name');
                return;
            }

            const exercise = {
                id: `ex_${Date.now()}_${Math.floor(Math.random() * 10000)}`, // Unique string ID
                name: name,
                videoUrl: getYouTubeEmbedUrl(videoUrl),
                bodyParts: bodyParts,
                sets: [
                    { weight: '', reps: '' }
                ]
            };

            exercises.push(exercise);
            saveToLocalStorage();
            renderExercises();
            closeAddExerciseModal();
        }

        function deleteExercise(id) {
            if (confirm('Are you sure you want to delete this exercise?')) {
                exercises = exercises.filter(ex => ex.id !== id);
                saveToLocalStorage();
                renderExercises();
            }
        }

        function addSet(exerciseId) {
            const exercise = exercises.find(ex => ex.id === exerciseId);
            if (exercise) {
                exercise.sets.push({ weight: '', reps: '' });
                saveToLocalStorage();
                renderExercises();
            }
        }

        function removeSet(exerciseId, setIndex) {
            const exercise = exercises.find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets.length > 1) {
                exercise.sets.splice(setIndex, 1);
                saveToLocalStorage();
                renderExercises();
            } else {
                alert('Each exercise must have at least one set');
            }
        }

        function updateSet(exerciseId, setIndex, field, value) {
            const exercise = exercises.find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex][field] = value;
                saveToLocalStorage();
            }
        }

        function renderExercises() {
            const container = document.getElementById('exercises-container');
            
            if (exercises.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏋️</div>
                        <div class="empty-state-text">No exercises yet</div>
                        <p>Click "Add Exercise" to get started with your workout plan!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = exercises.map(exercise => `
                <div class="exercise-card">
                    <div class="exercise-header">
                        <div>
                            <div class="exercise-title editable-field" onclick="editExerciseName('${exercise.id}')" title="Click to edit">
                                ${escapeHtml(exercise.name)}<span class="edit-icon">✏️</span>
                            </div>
                            ${exercise.bodyParts ? `<div class="exercise-body-parts editable-field" onclick="editExerciseBodyParts('${exercise.id}')" title="Click to edit">${escapeHtml(exercise.bodyParts)}<span class="edit-icon">✏️</span></div>` : '<div class="exercise-body-parts editable-field" onclick="editExerciseBodyParts(\'${exercise.id}\')" title="Click to add body parts"><em>Add body parts</em><span class="edit-icon">✏️</span></div>'}
                        </div>
                        <button class="btn btn-danger btn-small" onclick="deleteExercise('${exercise.id}')">🗑️ Delete</button>
                    </div>
                    
                    ${exercise.videoUrl ? `
                        <div class="video-container">
                            <iframe 
                                src="${exercise.videoUrl}" 
                                frameborder="0" 
                                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    ` : '<div style="margin-bottom: 10px;"><button class="btn btn-info btn-small" onclick="editExerciseVideo(\'${exercise.id}\')">➕ Add Video</button></div>'}
                    
                    <div class="sets-container">
                        ${exercise.sets.map((set, index) => `
                            <div class="set-row">
                                <span class="set-label">Set ${index + 1}</span>
                                <input 
                                    type="text" 
                                    inputmode="decimal"
                                    class="set-input" 
                                    placeholder="Weight (lbs/kg)" 
                                    value="${escapeHtml(set.weight)}"
                                    onchange="updateSet('${exercise.id}', ${index}, 'weight', this.value)">
                                <input 
                                    type="text" 
                                    inputmode="numeric"
                                    class="set-input" 
                                    placeholder="Reps" 
                                    value="${escapeHtml(set.reps)}"
                                    onchange="updateSet('${exercise.id}', ${index}, 'reps', this.value)">
                                <button class="btn btn-danger btn-small" onclick="removeSet('${exercise.id}', ${index})" ${exercise.sets.length === 1 ? 'disabled' : ''}>✖</button>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="exercise-controls">
                        <button class="btn btn-primary btn-small" onclick="addSet('${exercise.id}')">➕ Add Set</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }

        function exportWorkout() {
            if (exercises.length === 0) {
                alert('No exercises to export. Add some exercises first!');
                return;
            }

            workoutTitle = document.getElementById('workout-title').value.trim() || 'My Workout';
            const data = {
                workoutTitle: workoutTitle,
                exercises: exercises,
                timerSeconds: timerSeconds,
                exportedAt: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            
            // Create filename with workout title, datetime, and duration
            const sanitizedTitle = workoutTitle.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const datetime = new Date().toISOString().replace(/[:.]/g, '-').split('T')[0] + '_' + new Date().toTimeString().split(' ')[0].replace(/:/g, '-');
            const duration = formatDuration(timerSeconds);
            link.download = `${sanitizedTitle}_${datetime}_${duration}.json`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function importWorkout() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        
                        // Check if it's new format or legacy format
                        let newExercises, newTitle, newTimerSeconds;
                        
                        if (imported.exercises && Array.isArray(imported.exercises)) {
                            // New format
                            newExercises = imported.exercises;
                            newTitle = imported.workoutTitle || 'Imported Workout';
                            newTimerSeconds = imported.timerSeconds || 0;
                        } else if (Array.isArray(imported)) {
                            // Legacy format
                            newExercises = imported;
                            newTitle = 'Imported Workout';
                            newTimerSeconds = 0;
                        } else {
                            throw new Error('Invalid workout file format');
                        }

                        const confirmMsg = exercises.length > 0 
                            ? 'This will replace your current workout. Continue?' 
                            : 'Import this workout plan?';

                        if (confirm(confirmMsg)) {
                            exercises = newExercises;
                            workoutTitle = newTitle;
                            timerSeconds = newTimerSeconds;
                            document.getElementById('workout-title').value = workoutTitle;
                            pauseTimer();
                            updateTimerDisplay();
                            saveToLocalStorage();
                            renderExercises();
                        }
                    } catch (error) {
                        alert('Error importing workout: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };
            
            input.click();
        }

        // Edit functions
        function editExerciseName(exerciseId) {
            const exercise = exercises.find(ex => ex.id === exerciseId);
            if (!exercise) return;
            
            const newName = prompt('Edit exercise name:', exercise.name);
            if (newName !== null && newName.trim()) {
                exercise.name = newName.trim();
                saveToLocalStorage();
                renderExercises();
            }
        }

        function editExerciseBodyParts(exerciseId) {
            const exercise = exercises.find(ex => ex.id === exerciseId);
            if (!exercise) return;
            
            const newBodyParts = prompt('Edit body parts (comma separated):', exercise.bodyParts || '');
            if (newBodyParts !== null) {
                exercise.bodyParts = newBodyParts.trim();
                saveToLocalStorage();
                renderExercises();
            }
        }

        function editExerciseVideo(exerciseId) {
            const exercise = exercises.find(ex => ex.id === exerciseId);
            if (!exercise) return;
            
            const currentUrl = exercise.videoUrl ? exercise.videoUrl.replace('https://www.youtube.com/embed/', 'https://www.youtube.com/watch?v=') : '';
            const newUrl = prompt('Edit YouTube video URL:', currentUrl);
            if (newUrl !== null) {
                exercise.videoUrl = getYouTubeEmbedUrl(newUrl.trim());
                saveToLocalStorage();
                renderExercises();
            }
        }

        // Close modal when clicking outside
        document.getElementById('add-exercise-modal').addEventListener('click', (e) => {
            if (e.target.id === 'add-exercise-modal') {
                closeAddExerciseModal();
            }
        });
    </script>
</body>
</html>
