<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .btn-info {
            background: #4299e1;
            color: white;
        }

        .btn-info:hover {
            background: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            min-width: auto;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .exercises-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .exercise-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .exercise-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .exercise-title {
            font-size: 1.5rem;
            color: #2d3748;
            font-weight: 700;
        }

        .exercise-body-parts {
            color: #718096;
            font-size: 0.9rem;
            font-style: italic;
            margin-top: 5px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin-bottom: 15px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .sets-container {
            margin-bottom: 15px;
        }

        .set-row {
            display: grid;
            grid-template-columns: auto 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .set-label {
            font-weight: 600;
            color: #4a5568;
        }

        .set-input {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .set-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .exercise-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .add-video-container {
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .exercise-title {
                font-size: 1.2rem;
            }

            .set-row {
                grid-template-columns: auto 1fr 1fr auto;
                gap: 5px;
                padding: 8px;
            }

            .btn {
                min-width: 120px;
                padding: 10px 16px;
            }

            .modal-content {
                padding: 20px;
            }
        }

        .workout-title-container {
            margin-bottom: 20px;
        }

        .workout-title-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        .workout-title-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .timer-container {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .video-collapsed {
            display: none;
        }

        .video-toggle-btn {
            margin-bottom: 10px;
        }

        .drag-handle {
            cursor: move;
            padding: 8px;
            color: #718096;
            font-size: 1.2rem;
            display: inline-block;
            margin-right: 10px;
        }

        .drag-handle:hover {
            color: #4a5568;
        }

        .exercise-card.sortable-ghost {
            opacity: 0.4;
        }

        .exercise-card.sortable-drag {
            opacity: 0.8;
        }

        .autocomplete-items {
            position: absolute;
            border: 2px solid #e2e8f0;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border-radius: 0 0 6px 6px;
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            background-color: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .autocomplete-items div:hover {
            background-color: #f7fafc;
        }

        .autocomplete-active {
            background-color: #667eea !important;
            color: white;
        }

        .form-group {
            position: relative;
        }

        .workout-selector {
            margin-bottom: 20px;
        }

        .workout-selector select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .workout-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .workout-selector select:hover {
            border-color: #cbd5e0;
        }

        .scroll-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #667eea;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .scroll-to-top:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
        }

        .scroll-to-top.visible {
            display: flex;
        }

        .bottom-controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .scroll-to-top {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                min-width: auto;
            }

            .set-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .set-label {
                grid-column: 1 / -1;
            }

            .set-row .set-input {
                width: 100%;
            }

            .set-row .btn {
                width: 100%;
            }

            .exercise-controls {
                flex-direction: column;
            }

            .timer-display {
                font-size: 2rem;
            }

            .workout-title-input {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Workout Tracker</h1>
        
        <!-- Workout Selector -->
        <div class="workout-selector">
            <select id="workout-selector" onchange="loadSelectedWorkout()">
                <option value="current">Current Workout</option>
            </select>
            <button class="btn btn-danger btn-small" onclick="deleteSelectedWorkout()" style="margin-top: 10px; width: 100%;">🗑️ Delete Selected Workout</button>
        </div>
        
        <!-- Workout Title -->
        <div class="workout-title-container">
            <input type="text" id="workout-title" class="workout-title-input" placeholder="Enter workout name..." value="My Workout">
        </div>
        
        <!-- Timer -->
        <div class="timer-container">
            <div class="timer-display" id="timer-display">00:00:00</div>
            <div class="timer-controls">
                <button class="btn btn-success btn-small" id="play-btn" onclick="startTimer()">▶️ Play</button>
                <button class="btn btn-danger btn-small" id="pause-btn" onclick="pauseTimer()" style="display: none;">⏸️ Pause</button>
                <button class="btn btn-info btn-small" onclick="resetTimer()">🔄 Reset</button>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="showAddExerciseModal()">➕ Add Exercise</button>
            <button class="btn btn-success" onclick="saveWorkout()">💾 Save Workout</button>
            <button class="btn btn-success" onclick="saveAsTemplate()">📋 Save as Template</button>
            <button class="btn btn-primary" onclick="showTemplateSelector()">🎯 Start from Template</button>
            <button class="btn btn-danger" onclick="resetWorkout()">🔄 Reset Workout</button>
            <button class="btn btn-info" onclick="resetAllValues()">⚡ Reset All Values</button>
            <button class="btn btn-success" onclick="exportWorkout()">📥 Export Workout</button>
            <button class="btn btn-info" onclick="importWorkout()">📤 Import Workout</button>
            <button class="btn btn-success" onclick="exportMultipleWorkouts()">📦 Export Multiple (ZIP)</button>
            <button class="btn btn-info" onclick="importZipWorkouts()">📦 Import ZIP</button>
            <button class="btn btn-info" id="toggle-all-videos-btn" onclick="toggleAllVideos()">📺 Collapse All Videos</button>
        </div>

        <div id="exercises-container" class="exercises-container">
            <div class="empty-state">
                <div class="empty-state-icon">🏋️</div>
                <div class="empty-state-text">No exercises yet</div>
                <p>Click "Add Exercise" to get started with your workout plan!</p>
            </div>
        </div>

        <div class="bottom-controls">
            <button class="btn btn-primary" onclick="showAddExerciseModal()">➕ Add Exercise</button>
        </div>
    </div>

    <!-- Template Selector Modal -->
    <div id="template-selector-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Start from Template</div>
            <div class="form-group">
                <label class="form-label">Select a Template</label>
                <select id="template-selector" class="form-input" size="10" style="height: 300px;">
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="loadTemplate()">Load Template</button>
                <button class="btn btn-danger" onclick="deleteSelectedTemplate()">Delete Template</button>
                <button class="btn btn-danger" onclick="closeTemplateSelector()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scroll to Top Button -->
    <button class="scroll-to-top" id="scroll-to-top" onclick="scrollToTop()">↑</button>

    <!-- Add/Edit Exercise Modal -->
    <div id="add-exercise-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modal-header-text">Add New Exercise</div>
            <div class="form-group">
                <label class="form-label">Exercise Name *</label>
                <input type="text" id="exercise-name" class="form-input" placeholder="e.g., Bench Press" required>
            </div>
            <div class="form-group">
                <label class="form-label">YouTube Video URL (optional)</label>
                <input type="text" id="exercise-video" class="form-input" placeholder="e.g., https://www.youtube.com/watch?v=...">
            </div>
            <div class="form-group">
                <label class="form-label">Body Parts Worked (optional)</label>
                <input type="text" id="exercise-body-parts" class="form-input" placeholder="e.g., Chest, Triceps, Shoulders">
                <button class="btn btn-info btn-small" onclick="autoDetermineBodyParts()" style="margin-top: 8px; width: 100%;">🔍 Auto-Determine Body Parts</button>
            </div>
            <div class="form-group">
                <label class="form-label">Setup Details (optional)</label>
                <textarea id="exercise-setup" class="form-input" placeholder="e.g., Bench angle at 30 degrees, grip width shoulder-width apart..." rows="3" style="resize: vertical;"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Notes/Description (optional)</label>
                <textarea id="exercise-notes" class="form-input" placeholder="e.g., Focus on slow negative, pause at bottom..." rows="3" style="resize: vertical;"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="modal-submit-btn" onclick="saveExerciseFromModal()">Add Exercise</button>
                <button class="btn btn-danger" onclick="closeExerciseModal()">Cancel</button>
            </div>
        </div>
    </div>

        function loadSavedWorkouts() {
            const saved = localStorage.getItem('savedWorkouts');
            if (saved) {
                try {
                    savedWorkouts = JSON.parse(saved);
                } catch (e) {
                    console.error('Error loading saved workouts:', e);
                    savedWorkouts = [];
                }
            }
        }

        function saveSavedWorkouts() {
            // Limit to 50 workouts
            // localStorage typically has a 5-10MB limit per domain (varies by browser)
            // With average workout size ~20KB (10 exercises with all data), 50 workouts = ~1MB
            // This leaves plenty of space for other data and future growth
            // Maximum theoretical capacity: ~250-500 workouts before hitting storage limits
            if (savedWorkouts.length > 50) {
                savedWorkouts = savedWorkouts.slice(0, 50);
            }
            try {
                localStorage.setItem('savedWorkouts', JSON.stringify(savedWorkouts));
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.code === 22) {
                    alert('Storage limit exceeded! Please delete some old workouts or export them to free up space.');
                    console.error('localStorage quota exceeded:', e);
                } else {
                    console.error('Error saving workouts:', e);
                }
            }
        }

        function loadUsedExerciseNames() {
            const saved = localStorage.getItem('usedExerciseNames');
            if (saved) {
                try {
                    usedExerciseNames = new Set(JSON.parse(saved));
                } catch (e) {
                    console.error('Error loading used exercise names:', e);
                    usedExerciseNames = new Set();
                }
            }
        }

        function saveUsedExerciseNames() {
            localStorage.setItem('usedExerciseNames', JSON.stringify([...usedExerciseNames]));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('workoutPlan');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.exercises) {
                        exercises = data.exercises;
                        workoutTitle = data.workoutTitle || 'My Workout';
                        timerSeconds = data.timerSeconds || 0;
                        document.getElementById('workout-title').value = workoutTitle;
                        updateTimerDisplay();
                    } else {
                        // Legacy format
                        exercises = data;
                    }
                } catch (e) {
                    console.error('Error loading from localStorage:', e);
                }
            }
        }

        function saveToLocalStorage() {
            const data = {
                workoutTitle: workoutTitle,
                exercises: exercises,
                timerSeconds: timerSeconds
            };
            try {
                localStorage.setItem('workoutPlan', JSON.stringify(data));
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.code === 22) {
                    alert('Storage limit exceeded! Consider exporting and removing old workouts to free up space.');
                    console.error('localStorage quota exceeded:', e);
                } else {
                    console.error('Error saving to localStorage:', e);
                }
            }

        function saveWorkout() {
            workoutTitle = document.getElementById('workout-title').value.trim() || 'My Workout';
            
            // Check if a workout with the same name already exists
            const existingIndex = savedWorkouts.findIndex(w => w.workoutTitle === workoutTitle && !w.isTemplate);
            if (existingIndex !== -1) {
                if (!confirm(`A workout named "${workoutTitle}" already exists. Do you want to overwrite it?`)) {
                    return;
                }
                // Remove the existing workout
                savedWorkouts.splice(existingIndex, 1);
            }

            const workoutData = {
                workoutTitle: workoutTitle,
                exercises: exercises,
                timerSeconds: timerSeconds,
                savedAt: new Date().toISOString(),
                isTemplate: false
            };

            // Add to saved workouts
            savedWorkouts.unshift(workoutData);
            
            // Limit to 50 workouts
            if (savedWorkouts.length > 50) {
                savedWorkouts = savedWorkouts.slice(0, 50);
            }

            saveSavedWorkouts();
            saveToLocalStorage();
            updateWorkoutSelector();
            alert('Workout saved successfully!');

                    return;

                savedWorkouts.splice(existingIndex, 1);

                videoUrl: exercise.videoUrl,
                bodyParts: exercise.bodyParts,
                setup: exercise.setup,
                notes: exercise.notes,

            }));

            const templateData = {
                workoutTitle: templateTitle,
                exercises: templateExercises,
                timerSeconds: 0,
                savedAt: new Date().toISOString(),
                isTemplate: true

            savedWorkouts.unshift(templateData);

        // Timer functions
        function startTimer() {
            if (!timerRunning) {
                timerRunning = true;
                document.getElementById('play-btn').style.display = 'none';
                document.getElementById('pause-btn').style.display = 'inline-block';
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateTimerDisplay();
                    // Save to localStorage every 10 seconds to reduce performance impact
                    if (timerSeconds % 10 === 0) {
                        saveToLocalStorage();
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            if (timerRunning) {
                timerRunning = false;
                document.getElementById('play-btn').style.display = 'inline-block';
                document.getElementById('pause-btn').style.display = 'none';
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                // Save when paused
                saveToLocalStorage();
            }
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 0;
            updateTimerDisplay();
            saveToLocalStorage();
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timerSeconds / 3600);
            const minutes = Math.floor((timerSeconds % 3600) / 60);
            const seconds = timerSeconds % 60;
            const display = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('timer-display').textContent = display;
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours}h${minutes}m${secs}s`;
        }

        function autoDetermineBodyParts() {
            const exerciseName = document.getElementById('exercise-name').value.trim();
            
            if (!exerciseName) {
                alert('Please enter an exercise name first');
                return;
            }

            // Try to find an exact match first (case-insensitive)
            const lowerExerciseName = exerciseName.toLowerCase();
            for (const [key, value] of Object.entries(exerciseBodyPartsMap)) {
                if (key.toLowerCase() === lowerExerciseName) {
                    document.getElementById('exercise-body-parts').value = value;
                    return;
                }
            }

            // Try partial match only if the exercise name is contained within a known exercise
            // This avoids false positives like 'Squat' matching 'Overhead Squat'
            for (const [key, value] of Object.entries(exerciseBodyPartsMap)) {
                const lowerKey = key.toLowerCase();
                // Only match if the exercise name matches the start of a known exercise
                // or is a significant part of it (more than 5 characters)
                if (lowerExerciseName.length > 5 && lowerKey.includes(lowerExerciseName)) {
                    document.getElementById('exercise-body-parts').value = value;
                    return;
                }
            }

            alert('Could not automatically determine body parts for this exercise. Please enter them manually.');
        }

        function setupAutocomplete() {
            const input = document.getElementById('exercise-name');
            let currentFocus = -1;

            // Combine top 100 exercises with user's previously used names
            const allExercises = [...new Set([...top100Exercises, ...Array.from(usedExerciseNames)])].sort();

            input.addEventListener('input', function(e) {
                removeAutocomplete();
                const val = this.value;
                if (!val) return;
                
                currentFocus = -1;
                const autocompleteDiv = document.createElement('div');
                autocompleteDiv.setAttribute('id', 'autocomplete-list');
                autocompleteDiv.setAttribute('class', 'autocomplete-items');
                this.parentNode.appendChild(autocompleteDiv);

                const matches = allExercises.filter(ex => 
                    ex.toLowerCase().includes(val.toLowerCase())
                ).slice(0, 10);

                matches.forEach(exercise => {
                    const item = document.createElement('div');
                    const matchIndex = exercise.toLowerCase().indexOf(val.toLowerCase());
                    item.innerHTML = exercise.substring(0, matchIndex) + 
                                   '<strong>' + exercise.substring(matchIndex, matchIndex + val.length) + '</strong>' +
                                   exercise.substring(matchIndex + val.length);
                    item.innerHTML += '<input type="hidden" value="' + exercise + '">';
                    
                    item.addEventListener('click', function() {
                        input.value = this.getElementsByTagName('input')[0].value;
                        removeAutocomplete();
                    });
                    
                    autocompleteDiv.appendChild(item);
                });
            });

            input.addEventListener('keydown', function(e) {
                let x = document.getElementById('autocomplete-list');
                if (x) x = x.getElementsByTagName('div');
                if (e.keyCode === 40) { // Down arrow
                    currentFocus++;
                    addActive(x);
                    e.preventDefault();
                } else if (e.keyCode === 38) { // Up arrow
                    currentFocus--;
                    addActive(x);
                    e.preventDefault();
                } else if (e.keyCode === 13) { // Enter
                    e.preventDefault();
                    if (currentFocus > -1) {
                        if (x) x[currentFocus].click();
                    }
                }
            });

            function addActive(x) {
                if (!x) return false;
                removeActive(x);
                if (currentFocus >= x.length) currentFocus = 0;
                if (currentFocus < 0) currentFocus = (x.length - 1);
                x[currentFocus].classList.add('autocomplete-active');
            }

            function removeActive(x) {
                for (let i = 0; i < x.length; i++) {
                    x[i].classList.remove('autocomplete-active');
                }
            }
        }

        function removeAutocomplete() {
            const autocompleteList = document.getElementById('autocomplete-list');
            if (autocompleteList) {
                autocompleteList.parentNode.removeChild(autocompleteList);
            }
        }

        function getYouTubeEmbedUrl(url) {
            if (!url) return null;
            
            // Extract video ID from various YouTube URL formats
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/,
                /youtube\.com\/embed\/([^&\s]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    return `https://www.youtube.com/embed/${match[1]}`;
                }
            }
            
            return null;
        }

        function renderExerciseSets(exerciseId) {

            if (!exercise) return;

            const container = document.querySelector(`#exercise-${exerciseId} .sets-container`);
            if (!container) return;

            container.innerHTML = exercise.sets.map((set, index) => `
                <div class="set-row">
                    <span class="set-label">Set ${index + 1}</span>
                    <input 
                        type="text" 
                        inputmode="decimal"
                        class="set-input" 
                        placeholder="Weight (lbs/kg)" 
                        value="${escapeHtml(set.weight)}"
                        onchange="updateSet('${exercise.id}', ${index}, 'weight', this.value)">
                    <input 
                        type="text" 
                        inputmode="numeric"
                        class="set-input" 
                        placeholder="Reps" 
                        value="${escapeHtml(set.reps)}"
                        onchange="updateSet('${exercise.id}', ${index}, 'reps', this.value)">
                    <button class="btn btn-danger btn-small" onclick="removeSet('${exercise.id}', ${index})" ${exercise.sets.length === 1 ? 'disabled' : ''}>✖</button>
                </div>
            `).join('');
        }

        function renderExercises() {
            const container = document.getElementById('exercises-container');
            
            if (exercises.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏋️</div>
                        <div class="empty-state-text">No exercises yet</div>
                        <p>Click "Add Exercise" to get started with your workout plan!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = exercises.map(exercise => `
                <div class="exercise-card" data-id="${exercise.id}" id="exercise-${exercise.id}">
                    <div class="exercise-header">
                        <div style="display: flex; align-items: center; flex: 1;">
                            <span class="drag-handle">⋮⋮</span>
                            <div>
                                <div class="exercise-title">
                                    ${escapeHtml(exercise.name)}
                                </div>
                                ${renderBodyPartsField(exercise)}
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-info btn-small" onclick="editExercise('${exercise.id}')">✏️ Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deleteExercise('${exercise.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                    
                    ${renderVideoSection(exercise)}
                    
                    ${renderSetupAndNotes(exercise)}
                    
                    <div class="sets-container">
                        ${exercise.sets.map((set, index) => `
                            <div class="set-row">
                                <span class="set-label">Set ${index + 1}</span>
                                <input 
                                    type="text" 
                                    inputmode="decimal"
                                    class="set-input" 
                                    placeholder="Weight (lbs/kg)" 
                                    value="${escapeHtml(set.weight)}"
                                    onchange="updateSet('${exercise.id}', ${index}, 'weight', this.value)">
                                <input 
                                    type="text" 
                                    inputmode="numeric"
                                    class="set-input" 
                                    placeholder="Reps" 
                                    value="${escapeHtml(set.reps)}"
                                    onchange="updateSet('${exercise.id}', ${index}, 'reps', this.value)">
                                <button class="btn btn-danger btn-small" onclick="removeSet('${exercise.id}', ${index})" ${exercise.sets.length === 1 ? 'disabled' : ''}>✖</button>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="exercise-controls">
                        <button class="btn btn-primary btn-small" onclick="addSet('${exercise.id}')">➕ Add Set</button>
                    </div>
                </div>
            `).join('');
        }

        function initializeSortable() {
            const container = document.getElementById('exercises-container');
            
            // Destroy existing sortable instance if any
            if (sortableInstance) {
                sortableInstance.destroy();
            }

            if (exercises.length === 0) return;

            // Check if Sortable is available
            if (typeof Sortable === 'undefined') {
                console.warn('Sortable library not loaded, drag-and-drop disabled');
                return;
            }

            sortableInstance = Sortable.create(container, {
                animation: 150,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: function(evt) {
                    // Reorder exercises array
                    const movedExercise = exercises.splice(evt.oldIndex, 1)[0];
                    exercises.splice(evt.newIndex, 0, movedExercise);
                    saveToLocalStorage();
                }
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }

        function editExercise(exerciseId) {
            showEditExerciseModal(exerciseId);
        }

        function generateExportFilename(title, seconds) {
            const sanitizedTitle = title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const now = new Date();
            const date = now.toISOString().split('T')[0];
            const time = now.toTimeString().split(' ')[0].replace(/:/g, '-');
            const datetime = `${date}_${time}`;
            const duration = formatDuration(seconds);
            return `${sanitizedTitle}_${datetime}_${duration}.json`;
        }

        function exportWorkout() {
            if (exercises.length === 0) {
                alert('No exercises to export. Add some exercises first!');
                return;
            }

            workoutTitle = document.getElementById('workout-title').value.trim() || 'My Workout';
            const data = {
                workoutTitle: workoutTitle,
                exercises: exercises,
                timerSeconds: timerSeconds,
                exportedAt: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = generateExportFilename(workoutTitle, timerSeconds);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function exportMultipleWorkouts() {
            if (savedWorkouts.length === 0) {
                alert('No saved workouts to export. Save some workouts first!');
                return;
            }

            // Check if JSZip is available
            if (typeof JSZip === 'undefined') {
                alert('ZIP export functionality is not available. Please check your internet connection and reload the page.');
                return;
            }

            const zip = new JSZip();
            
            savedWorkouts.forEach((workout, index) => {
                const filename = generateExportFilename(workout.workoutTitle, workout.timerSeconds || 0);
                const dataStr = JSON.stringify(workout, null, 2);
                zip.file(filename, dataStr);
            });

            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(zipBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `workouts_${new Date().toISOString().split('T')[0]}.zip`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            alert(`Exported ${savedWorkouts.length} workouts as ZIP file!`);
        }

        function importWorkout() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        
                        // Check if it's new format or legacy format
                        let newExercises, newTitle, newTimerSeconds;
                        
                        if (imported.exercises && Array.isArray(imported.exercises)) {
                            // New format
                            newExercises = imported.exercises;
                            newTitle = imported.workoutTitle || 'Imported Workout';
                            newTimerSeconds = imported.timerSeconds || 0;
                        } else if (Array.isArray(imported)) {
                            // Legacy format
                            newExercises = imported;
                            newTitle = 'Imported Workout';
                            newTimerSeconds = 0;
                        } else {
                            throw new Error('Invalid workout file format');
                        }

                        const confirmMsg = exercises.length > 0 
                            ? 'This will replace your current workout. Continue?' 
                            : 'Import this workout plan?';

                        if (confirm(confirmMsg)) {
                            exercises = newExercises;
                            workoutTitle = newTitle;
                            timerSeconds = newTimerSeconds;
                            document.getElementById('workout-title').value = workoutTitle;
                            pauseTimer();
                            updateTimerDisplay();
                            saveToLocalStorage();
                            renderExercises();
                            initializeSortable();
                        }
                    } catch (error) {
                        alert('Error importing workout: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };
            
            input.click();
        }

        async function importZipWorkouts() {
            // Check if JSZip is available
            if (typeof JSZip === 'undefined') {
                alert('ZIP import functionality is not available. Please check your internet connection and reload the page.');
                return;
            }

            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.zip';
            
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    const zip = await JSZip.loadAsync(file);
                    let importedCount = 0;
                    
                    for (const [filename, zipEntry] of Object.entries(zip.files)) {
                        if (zipEntry.dir || !filename.endsWith('.json')) continue;
                        
                        const content = await zipEntry.async('string');
                        try {
                            const workoutData = JSON.parse(content);
                            
                            // Validate workout data
                            if (workoutData.exercises && Array.isArray(workoutData.exercises)) {
                                if (!workoutData.savedAt) {
                                    workoutData.savedAt = new Date().toISOString();
                                }
                                savedWorkouts.unshift(workoutData);
                                importedCount++;
                            }
                        } catch (parseError) {
                            console.error(`Error parsing ${filename}:`, parseError);
                        }
                    }
                    
                    // Limit to 50 workouts
                    if (savedWorkouts.length > 50) {
                        savedWorkouts = savedWorkouts.slice(0, 50);
                    }
                    
                    saveSavedWorkouts();
                    updateWorkoutSelector();
                    
                    alert(`Successfully imported ${importedCount} workouts from ZIP file!`);
                } catch (error) {
                    alert('Error importing ZIP file: ' + error.message);
                }
            };
            
            input.click();
        }

        // Close modal when clicking outside
        document.getElementById('add-exercise-modal').addEventListener('click', (e) => {
            if (e.target.id === 'add-exercise-modal') {
                closeExerciseModal();
            }
        });

        // Close template modal when clicking outside
        document.getElementById('template-selector-modal').addEventListener('click', (e) => {
            if (e.target.id === 'template-selector-modal') {
                closeTemplateSelector();
            }
        });

        // Close autocomplete when clicking outside
        document.addEventListener('click', function(e) {
            if (e.target.id !== 'exercise-name') {
                removeAutocomplete();
            }
        });

        // Scroll to top functionality
        function initScrollToTop() {
            const scrollBtn = document.getElementById('scroll-to-top');
            
            window.addEventListener('scroll', () => {
                const currentScrollY = window.scrollY;
                
                // Clear existing timeout
                if (scrollTimeout) {
                    clearTimeout(scrollTimeout);
                }
                
                // Show button if scrolling up and not at the top
                if (currentScrollY < lastScrollY && currentScrollY > 300) {
                    scrollBtn.classList.add('visible');
                    
                    // Hide button after 3 seconds of no scrolling
                    scrollTimeout = setTimeout(() => {
                        scrollBtn.classList.remove('visible');
                    }, 3000);
                } else if (currentScrollY <= 100) {
                    // Hide at the top
                    scrollBtn.classList.remove('visible');
                }
                
                lastScrollY = currentScrollY;
            });
        }

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
